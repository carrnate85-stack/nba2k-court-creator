[package]
name = "court-core"
version = "2.0.0-preview.1"
edition = "2024"
description = "NBA 2K Court Creator court geometry, rendering, project and IFF export engine."

[dependencies]
# Shared 2K Canvas engine (DDS codecs, raster loading) and DirectWrite text, as explicit local dependencies.
canvas-engine = { path = "../../../../source/native/crates/canvas-engine" }
canvas-text = { path = "../../../../source/native/crates/canvas-text" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tga", "tiff", "webp", "gif"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
rayon = "1"
i_overlay = "2"
earcutr = "0.4"
uuid = { version = "1", features = ["v4"] }
regex = "1"
ryu = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
serde_json = "1"
